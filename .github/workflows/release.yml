name: Release

# Builds the desktop app when a version tag is pushed and attaches it to a draft GitHub release (published by hand after a look).
# macOS only: the Windows and Linux builds are not configured or tried yet. The app is not signed, so macOS asks to be told to open it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      # A tag that does not match package.json would ship a file named for another version.
      - name: Check the tag against package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No signing identity exists, so keep electron-builder from looking for one (and from publishing: the release is made below).
      - run: npm run build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create the draft release
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg --draft --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
